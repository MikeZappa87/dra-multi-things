# =============================================================================
# Example 5: RoCE (combo) device
# =============================================================================
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: roce-claim-template
  namespace: default
spec:
  spec:
    devices:
      requests:
      - name: roce
        exactly:
          deviceClassName: roce-devices
      config:
      - requests: ["roce"]
        opaque:
          driver: dra.example.com
          parameters:
            type: combo
            combo:
              rdma: {}
              netdev:
                kind: dummy
                interfaceName: rdma0
