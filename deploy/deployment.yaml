# =============================================================================
# Example 1: Macvlan network interface
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dra-macvlan-test
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dra-macvlan-test
  template:
    metadata:
      labels:
        app: dra-macvlan-test
    spec:
      containers:
        - name: test-container
          image: nicolaka/netshoot
          command:
            - /bin/sh
            - -c
            - |
              echo "Pod started: $(hostname)"
              echo "Checking network interfaces..."
              while true; do
                echo "=== Network Interfaces ==="
                ip link show
                echo ""
                echo "=== IP Addresses ==="
                ip addr show
                echo "=========================="
                sleep 10
              done
          resources:
            claims:
            - name: macvlan-nic
      resourceClaims:
        - name: macvlan-nic
          resourceClaimTemplateName: macvlan-claim-template
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: macvlan-claim-template
  namespace: default
spec:
  spec:
    devices:
      requests:
      - name: net
        exactly:
          deviceClassName: network-devices
          selectors:
          - cel:
              expression: device.driver == "dra.example.com" && device.attributes["dra.example.com"].type == "netdev"
      config:
      - requests: ["net"]
        opaque:
          driver: dra.example.com
          parameters:
            type: netdev
            netdev:
              kind: macvlan
              parent: eth0
              mode: bridge
              interfaceName: data0
---
