# Dedicated example for a Linux bridge in the host netns plus a VLAN-tagged veth
# moved into the pod by the DRA driver's NRI RunPodSandbox hook.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dra-bridge-vlan-test
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dra-bridge-vlan-test
  template:
    metadata:
      labels:
        app: dra-bridge-vlan-test
    spec:
      containers:
        - name: vlan-test
          image: nicolaka/netshoot
          command:
            - /bin/sh
            - -c
            - |
              echo "Pod started: $(hostname)"
              echo "=== eth0 and extra NIC ==="
              ip link show
              echo "=== VLAN interface details ==="
              ip -d link show dev vlan100 2>/dev/null || true
              echo "=== VLAN address ==="
              ip -br addr show dev vlan100 2>/dev/null || true
              echo "=== VLAN routes ==="
              ip route show dev vlan100 2>/dev/null || true
              while true; do
                sleep 10
              done
          resources:
            claims:
            - name: bridge-vlan-nic
      resourceClaims:
        - name: bridge-vlan-nic
          resourceClaimTemplateName: bridge-vlan-claim-template
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: bridge-vlan-claim-template
  namespace: default
spec:
  spec:
    devices:
      requests:
      - name: net
        exactly:
          deviceClassName: network-devices
          selectors:
          - cel:
              expression: device.driver == "dra.example.com" && device.attributes["dra.example.com"].type == "netdev"
      config:
      - requests: ["net"]
        opaque:
          driver: dra.example.com
          parameters:
            type: netdev
            netdev:
              kind: bridge-veth
              bridgeName: br-vlan100
              vlanId: 100
              interfaceName: vlan100
              poolName: vlan100-pool
